name: Verify NEXUS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: nexus-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXUS_AI_ONLY: ${{ contains(github.event.head_commit.message, '[ai-only]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: node scripts/setup.mjs
      - name: Use verified runtime artifacts
        run: echo 'COMPOSE_FILE=compose.yaml:compose.ci.yaml' >> "$GITHUB_ENV"
      - name: Relevant Java checks
        run: |
          docker info
          if [ "$NEXUS_AI_ONLY" = 'true' ]; then
            mvn -B package -DskipTests
            mvn -B -pl backend -Dtest=AiGroundingTest,OpenRouterConfigurationTest,IncidentMemoryTest test
          else
            mvn -B verify
            node scripts/test-summary.mjs
          fi
      - name: Build console; run fixtures for full acceptance
        run: |
          npm ci
          npm run build
          if [ "$NEXUS_AI_ONLY" != 'true' ]; then
            npx playwright install --with-deps chromium
            npm test
          fi
        working-directory: frontend
      - name: Full isolated stack
        run: |
          node scripts/setup.mjs
          docker compose config --quiet
          docker compose up --build -d
          node scripts/cloud-acceptance.mjs
      - name: Real browser against Compose
        if: env.NEXUS_AI_ONLY != 'true'
        run: npx playwright test --config playwright.live.config.ts
        working-directory: frontend
      - name: One explicitly requested free AI RAG scenario
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[nexus-ai]')
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENABLED: 'true'
          COLLECTORS_ENABLED: 'false'
        run: |
          test -n "$OPENAI_API_KEY"
          docker compose exec -T postgres psql -U nexus -d nexus -v ON_ERROR_STOP=1 -c "delete from memory where id<>(select id from memory order by created_at limit 1)"
          docker compose up -d --no-deps --force-recreate backend
          node scripts/cloud-ai.mjs
      - name: Redacted failure diagnostics
        if: failure()
        run: node scripts/diagnostics.mjs
      - name: Remove ephemeral containers and data
        if: always()
        run: docker compose down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-verification
          path: evidence/
          retention-days: 3
          if-no-files-found: ignore
