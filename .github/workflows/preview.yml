name: Temporary NEXUS browser preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-browser-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.application.yaml:compose.application.ci.yaml
      AI_ENABLED: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Build the verified application
        run: |
          node scripts/setup.mjs
          mvn -B package -DskipTests
          npm --prefix frontend ci
          npm --prefix frontend run build
          docker compose up --build -d
      - name: Populate actual preview workspace
        run: node scripts/preview-bootstrap.mjs
      - name: Open temporary HTTPS preview
        run: |
          docker run -d --name nexus-preview-tunnel --network host cloudflare/cloudflared:latest tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3000
          node scripts/preview-link.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: private-preview-access
          path: preview-access.json
          retention-days: 1
      - name: Browser review window — expires automatically
        run: sleep 1800
      - name: Remove temporary preview and data
        if: always()
        run: |
          docker rm -f nexus-preview-tunnel || true
          docker compose down -v --remove-orphans
