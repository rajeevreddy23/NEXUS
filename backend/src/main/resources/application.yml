server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: nexus-control
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
nexus:
  evaluation-enabled: ${EVALUATION_ENABLED:false}
  mode: ${NEXUS_MODE:demo}
  operations-token: ${OPERATIONS_TOKEN:}
  developer-user: ${NEXUS_USER:developer}
  developer-password: ${NEXUS_PASSWORD}
  observer-password: ${OBSERVER_PASSWORD}
  demo-token: ${DEMO_TOKEN}
  poll-ms: ${POLL_MS:10000}
  collectors-enabled: ${COLLECTORS_ENABLED:true}
  demo-enabled: ${DEMO_ENABLED:true}
  service-origin: ${SERVICE_ORIGIN:http://localhost}
  sandbox-url: ${SANDBOX_URL:http://localhost:8094}
  prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}
  loki-url: ${LOKI_URL:http://localhost:3100}
  jaeger-url: ${JAEGER_URL:http://localhost:16686}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:unused}
    base-url: ${AI_BASE_URL:https://openrouter.ai/api}
    chat-model: ${CHAT_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
    embedding-model: ${EMBEDDING_MODEL:nvidia/nemotron-3.5-embed-1b:free}
